<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STUDIO ARCHITECTURE</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Inter:wght@300;400&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #FDFBF7;
            --text-primary: #1A1A1A;
            --text-muted: rgba(26, 26, 26, 0.2);
            --font-serif: 'Cormorant Garamond', serif;
            --font-sans: 'Inter', sans-serif;
            --transition-speed: 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: var(--font-sans);
            overflow: hidden; /* 전체 페이지 수직 스크롤 대신 휠 이벤트 제어 */
            height: 100vh;
            width: 100vw;
        }

        /* Fullscreen Background Images */
        .bg-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .bg-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            opacity: 0;
            filter: blur(12px) brightness(0.95); /* 흐릿한 배경 효과 */
            transform: scale(1.05);
            transition: opacity var(--transition-speed), transform var(--transition-speed);
        }

        .bg-image.active {
            opacity: 0.35; /* 글자가 잘 보이도록 투명도 조절 */
            transform: scale(1);
        }

        /* Overlay for soft contrast */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(253,251,247,0.4) 0%, rgba(253,251,247,0.85) 100%);
            z-index: 2;
            pointer-events: none;
        }

        /* Navigation Header */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 2.5rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .logo {
            font-family: var(--font-serif);
            font-size: 1.4rem;
            letter-spacing: 0.08em;
            text-decoration: none;
            color: var(--text-primary);
        }

        nav a {
            margin-left: 2.5rem;
            text-decoration: none;
            color: var(--text-primary);
            font-size: 0.85rem;
            letter-spacing: 0.05em;
            opacity: 0.6;
            transition: opacity 0.3s;
        }

        nav a:hover {
            opacity: 1;
        }

        /* Center Wheel Project List */
        .project-slider {
            position: relative;
            z-index: 5;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .project-list {
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform var(--transition-speed);
            will-change: transform;
        }

        .project-item {
            font-family: var(--font-serif);
            font-size: clamp(2rem, 4vw, 3.8rem);
            font-weight: 300;
            padding: 1.5rem 0;
            color: var(--text-muted);
            cursor: pointer;
            transition: color var(--transition-speed), transform var(--transition-speed), opacity var(--transition-speed);
            text-align: center;
            white-space: nowrap;
            user-select: none;
            opacity: 0.4;
        }

        .project-item.active {
            color: var(--text-primary);
            opacity: 1;
            transform: scale(1.08);
        }

        /* Project Sub-info (Category / Year) */
        .project-info {
            position: fixed;
            bottom: 3.5rem;
            left: 5%;
            z-index: 10;
            font-size: 0.85rem;
            letter-spacing: 0.08em;
            color: var(--text-primary);
            opacity: 0.7;
            text-transform: uppercase;
        }

        .project-info span {
            display: inline-block;
            transition: opacity 0.4s, transform 0.4s;
        }

        /* Scroll Helper Indicator */
        .scroll-indicator {
            position: fixed;
            bottom: 3.5rem;
            right: 5%;
            z-index: 10;
            font-size: 0.75rem;
            letter-spacing: 0.1em;
            opacity: 0.4;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <!-- Background Images -->
    <div class="bg-container">
        <!-- 원하시는 이미지 주소로 src 주소를 교체하실 수 있습니다 -->
        <div class="bg-image active" style="background-image: url('https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=1920&q=80');"></div>
        <div class="bg-image" style="background-image: url('https://images.unsplash.com/photo-1513694203232-719a280e022f?auto=format&fit=crop&w=1920&q=80');"></div>
        <div class="bg-image" style="background-image: url('https://images.unsplash.com/photo-1600607687939-ce8a6c25118c?auto=format&fit=crop&w=1920&q=80');"></div>
        <div class="bg-image" style="background-image: url('https://images.unsplash.com/photo-1600566753376-12c8ab7fb75b?auto=format&fit=crop&w=1920&q=80');"></div>
    </div>

    <div class="overlay"></div>

    <header>
        <a href="#" class="logo">STUDIO ARCHITECTURE</a>
        <nav>
            <a href="#">Work</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <main class="project-slider">
        <div class="project-list" id="projectList">
            <div class="project-item active" data-index="0" data-info="Pavilion / 2026">01. Biodegradable Vault Pavilion</div>
            <div class="project-item" data-index="1" data-info="Research & Installation / 2025">02. Interlocking Shell Structure</div>
            <div class="project-item" data-index="2" data-info="Adaptive Reuse / 2026">03. All City Campus Masterplan</div>
            <div class="project-item" data-index="3" data-info="Exhibition & Model / 2025">04. Material & Light Study</div>
        </div>
    </main>

    <div class="project-info">
        <span id="infoText">Pavilion / 2026</span>
    </div>

    <div class="scroll-indicator">
        Scroll to Explore
    </div>

    <script>
        const projectList = document.getElementById('projectList');
        const items = document.querySelectorAll('.project-item');
        const bgImages = document.querySelectorAll('.bg-image');
        const infoText = document.getElementById('infoText');

        let currentIndex = 0;
        let isCoolingDown = false;
        const totalItems = items.length;

        function updateSlider(index) {
            if (index < 0 || index >= totalItems) return;

            currentIndex = index;

            // 1. 스크롤 위치 이동 (선택된 항목을 화면 중앙으로)
            const itemHeight = items[0].clientHeight;
            const offset = -(currentIndex * itemHeight) + (itemHeight / 2);
            projectList.style.transform = `translateY(${offset}px)`;

            // 2. 텍스트 활성화 클래스 변경
            items.forEach((item, i) => {
                if (i === currentIndex) {
                    item.classList.add('active');
                } else {
                    item.classList.remove('active');
                }
            });

            // 3. 배경 이미지 전환 (흐릿한 이미지 Fade In)
            bgImages.forEach((bg, i) => {
                if (i === currentIndex) {
                    bg.classList.add('active');
                } else {
                    bg.classList.remove('active');
                }
            });

            // 4. 하단 서브 정보 업데이트
            infoText.style.opacity = '0';
            infoText.style.transform = 'translateY(10px)';
            setTimeout(() => {
                infoText.textContent = items[currentIndex].getAttribute('data-info');
                infoText.style.opacity = '0.7';
                infoText.style.transform = 'translateY(0)';
            }, 300);
        }

        // 마우스 휠 이벤트 처리
        window.addEventListener('wheel', (e) => {
            if (isCoolingDown) return;

            if (e.deltaY > 0) {
                // 아래로 스크롤
                if (currentIndex < totalItems - 1) {
                    updateSlider(currentIndex + 1);
                    triggerCooldown();
                }
            } else {
                // 위로 스크롤
                if (currentIndex > 0) {
                    updateSlider(currentIndex - 1);
                    triggerCooldown();
                }
            }
        });

        // 연속 휠 동작 방지 (부드러운 전환)
        function triggerCooldown() {
            isCoolingDown = true;
            setTimeout(() => {
                isCoolingDown = false;
            }, 700);
        }

        // 클릭 시 해당 항목으로 이동
        items.forEach((item, i) => {
            item.addEventListener('click', () => {
                updateSlider(i);
            });
        });

        // 초기 위치 설정
        window.addEventListener('load', () => {
            updateSlider(0);
        });
    </script>
</body>
</html>
