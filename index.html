<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STUDIO VARA</title>
    <!-- Plus Jakarta Sans Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #0F0F0F;
            --bg-light: #FFFFFF;
            --font-main: 'Plus Jakarta Sans', sans-serif;
            --transition-speed: 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-dark);
            color: #FFFFFF;
            font-family: var(--font-main);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            -webkit-font-smoothing: antialiased;
        }

        /* ----------------------------------
           Header Navigation (Fixed Top)
        ---------------------------------- */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 2.5rem 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 200;
        }

        /* 회사명(로고) 비율 및 크기 키움 (10pt -> 13pt) */
        .logo {
            font-family: var(--font-main);
            font-size: 13pt;
            font-weight: 700;
            letter-spacing: 0.18em;
            text-decoration: none;
            color: #FFFFFF;
            cursor: pointer;
            transition: color 0.3s;
        }

        nav {
            display: flex;
            gap: 2.5rem;
        }

        nav a {
            text-decoration: none;
            color: #FFFFFF;
            font-size: 8.5pt;
            font-weight: 400;
            letter-spacing: 0.1em;
            opacity: 0.6;
            transition: opacity 0.3s, color 0.3s;
            cursor: pointer;
        }

        nav a:hover, nav a.active {
            opacity: 1;
        }

        /* Light Theme for Sub-pages (Grid & Detail) */
        body.light-theme header .logo, 
        body.light-theme header nav a {
            color: #1A1A1A;
        }

        /* ----------------------------------
           VIEW 1: Main Wheel Scroll View
        ---------------------------------- */
        .slider-view {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 1;
            visibility: visible;
            transition: opacity var(--transition-speed), visibility var(--transition-speed);
            z-index: 10;
        }

        .slider-view.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .bg-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .bg-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            opacity: 0;
            filter: brightness(0.75) contrast(1.05);
            transform: scale(1.02);
            transition: opacity var(--transition-speed), transform var(--transition-speed);
        }

        .bg-image.active {
            opacity: 0.85;
            transform: scale(1);
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to right, rgba(0,0,0,0.65) 0%, rgba(0,0,0,0.2) 60%, rgba(0,0,0,0.4) 100%);
            z-index: 2;
            pointer-events: none;
        }

        .project-slider {
            position: relative;
            z-index: 5;
            height: 100vh;
            display: flex;
            align-items: center;
            padding-left: 8%;
        }

        .project-list {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            transition: transform var(--transition-speed);
            will-change: transform;
        }

        .project-wrapper {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            padding: 1.1rem 0;
            cursor: pointer;
            user-select: none;
        }

        .project-item {
            font-family: var(--font-main);
            font-size: 10pt;
            font-weight: 400;
            letter-spacing: 0.08em;
            color: rgba(255, 255, 255, 0.35);
            white-space: nowrap;
            transition: color var(--transition-speed), opacity var(--transition-speed), transform var(--transition-speed);
        }

        .project-wrapper:hover .project-item {
            color: rgba(255, 255, 255, 0.85);
        }

        .project-wrapper.active .project-item {
            color: #FFFFFF;
            font-weight: 600;
            opacity: 1;
            transform: translateX(8px);
        }

        .project-type {
            font-family: var(--font-main);
            font-size: 8pt;
            font-weight: 300;
            letter-spacing: 0.1em;
            color: rgba(255, 255, 255, 0.9);
            margin-top: 0.35rem;
            opacity: 0;
            max-height: 0;
            overflow: hidden;
            transition: opacity var(--transition-speed), max-height var(--transition-speed), margin-top var(--transition-speed);
            text-transform: uppercase;
            padding-left: 8px;
        }

        .project-wrapper.active .project-type {
            opacity: 0.9;
            max-height: 30px;
        }

        .footer-info {
            position: fixed;
            bottom: 3rem;
            left: 8%;
            z-index: 10;
            font-size: 8pt;
            letter-spacing: 0.12em;
            color: rgba(255, 255, 255, 0.5);
        }

        .scroll-indicator {
            position: fixed;
            bottom: 3rem;
            right: 6%;
            z-index: 10;
            font-size: 8pt;
            letter-spacing: 0.12em;
            color: rgba(255, 255, 255, 0.4);
            text-transform: uppercase;
        }

        /* ----------------------------------
           VIEW 2: Instagram-Feed Style Projects Grid View
        ---------------------------------- */
        .grid-view {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-light);
            color: #1A1A1A;
            opacity: 0;
            visibility: hidden;
            transition: opacity var(--transition-speed), visibility var(--transition-speed);
            z-index: 20;
            overflow-y: auto;
            padding: 8rem 6% 5rem;
        }

        .grid-view.active {
            opacity: 1;
            visibility: visible;
        }

        .feed-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2rem;
            max-width: 1400px;
            margin: 0 auto;
        }

        @media (max-width: 900px) {
            .feed-grid { grid-template-columns: repeat(2, 1fr); }
        }

        @media (max-width: 600px) {
            .feed-grid { grid-template-columns: 1fr; }
        }

        .feed-card {
            cursor: pointer;
            background-color: #FAFAFA;
            border: 1px solid #EEEEEE;
            transition: transform 0.4s ease, box-shadow 0.4s ease;
        }

        .feed-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px rgba(0,0,0,0.06);
        }

        .feed-card img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            display: block;
        }

        .feed-card-info {
            padding: 1rem 1.2rem;
            display: flex;
            justify-content: space-between
