<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STUDIO VARA</title>
    <!-- Plus Jakarta Sans Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0F0F0F;
            --font-main: 'Plus Jakarta Sans', sans-serif;
            --transition-speed: 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: #FFFFFF;
            font-family: var(--font-main);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            -webkit-font-smoothing: antialiased;
        }

        /* Fullscreen Background Image Slider (stpmj Style Tone) */
        .bg-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .bg-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            opacity: 0;
            filter: brightness(0.75) contrast(1.05); /* stpmj 선명하면서 세련된 사진 톤 */
            transform: scale(1.02);
            transition: opacity var(--transition-speed), transform var(--transition-speed);
        }

        .bg-image.active {
            opacity: 0.85;
            transform: scale(1);
        }

        /* Dark Vignette Overlay for Text Legibility */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to right, rgba(0,0,0,0.65) 0%, rgba(0,0,0,0.2) 60%, rgba(0,0,0,0.4) 100%);
            z-index: 2;
            pointer-events: none;
        }

        /* Minimal Header */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 3rem 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .logo {
            font-family: var(--font-main);
            font-size: 10pt;
            font-weight: 600;
            letter-spacing: 0.15em;
            text-decoration: none;
            color: #FFFFFF;
        }

        nav a {
            margin-left: 3rem;
            text-decoration: none;
            color: #FFFFFF;
            font-size: 8pt;
            font-weight: 400;
            letter-spacing: 0.1em;
            opacity: 0.5;
            transition: opacity 0.3s;
        }

        nav a:hover {
            opacity: 1;
        }

        /* stpmj Style Vertical Index List */
        .project-slider {
            position: relative;
            z-index: 5;
            height: 100vh;
            display: flex;
            align-items: center;
            padding-left: 8%;
        }

        .project-list {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            transition: transform var(--transition-speed);
            will-change: transform;
        }

        .project-wrapper {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            padding: 1.1rem 0;
            cursor: pointer;
            user-select: none;
        }

        /* 메인 프로젝트 타이틀: Plus Jakarta Sans / 10pt */
        .project-item {
            font-family: var(--font-main);
            font-size: 10pt;
            font-weight: 400;
            letter-spacing: 0.08em;
            color: rgba(255, 255, 255, 0.35);
            white-space: nowrap;
            transition: color var(--transition-speed), opacity var(--transition-speed), transform var(--transition-speed);
        }

        .project-wrapper.active .project-item {
            color: #FFFFFF;
            font-weight: 600;
            opacity: 1;
            transform: translateX(8px); /* 활성화 시 미세한 이동 효과 */
        }

        /* 서브 건축 정보: 흰 글씨 / 8pt */
        .project-type {
            font-family: var(--font-main);
            font-size: 8pt;
            font-weight: 300;
            letter-spacing: 0.1em;
            color: rgba(255, 255, 255, 0.9);
            margin-top: 0.35rem;
            opacity: 0;
            max-height: 0;
            overflow: hidden;
            transition: opacity var(--transition-speed), max-height var(--transition-speed), margin-top var(--transition-speed);
            text-transform: uppercase;
            padding-left: 8px;
        }

        .project-wrapper.active .project-type {
            opacity: 0.9;
            max-height: 30px;
        }

        /* Index Count / Footer Info */
        .footer-info {
            position: fixed;
            bottom: 3rem;
            left: 8%;
            z-index: 10;
            font-size: 8pt;
            letter-spacing: 0.12em;
            color: rgba(255, 255, 255, 0.5);
        }

        .scroll-indicator {
            position: fixed;
            bottom: 3rem;
            right: 6%;
            z-index: 10;
            font-size: 8pt;
            letter-spacing: 0.12em;
            color: rgba(255, 255, 255, 0.4);
            text-transform: uppercase;
        }
    </style>
</head>
