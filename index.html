<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STUDIO VARA</title>
    <!-- Google Fonts: Plus Jakarta Sans & Cormorant Garamond -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #FDFBF7;
            --text-primary: #1A1A1A;
            --text-muted: rgba(26, 26, 26, 0.3);
            --font-main: 'Plus Jakarta Sans', sans-serif;
            --font-serif: 'Cormorant Garamond', serif;
            --transition-speed: 0.7s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: var(--font-main);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        /* Fullscreen Background Images (더 선명하게 조정) */
        .bg-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .bg-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            opacity: 0;
            /* 흐림 정도를 12px -> 4px로 줄여 조금 더 선명하게 연출 */
            filter: blur(4px) brightness(0.85); 
            transform: scale(1.03);
            transition: opacity var(--transition-speed), transform var(--transition-speed);
        }

        .bg-image.active {
            opacity: 0.65; /* 투명도를 올려 배경이 더 선명하게 노출됨 */
            transform: scale(1);
        }

        /* Soft Contrast Overlay */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.25); /* 흰 글씨가 잘 보이도록 어둡게 은은한 오버레이 */
            z-index: 2;
            pointer-events: none;
        }

        /* Header Navigation */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 2.5rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .logo {
            font-family: var(--font-main);
            font-size: 11pt;
            font-weight: 600;
            letter-spacing: 0.12em;
            text-decoration: none;
            color: #FFFFFF;
            text-shadow: 0 1px 3px rgba(0,0,0,0.3);
        }

        nav a {
            margin-left: 2.5rem;
            text-decoration: none;
            color: #FFFFFF;
            font-size: 8.5pt;
            letter-spacing: 0.08em;
            opacity: 0.7;
            transition: opacity 0.3s;
            text-shadow: 0 1px 3px rgba(0,0,0,0.3);
        }

        nav a:hover {
            opacity: 1;
        }

        /* Center Project Slider */
        .project-slider {
            position: relative;
            z-index: 5;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .project-list {
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform var(--transition-speed);
            will-change: transform;
        }

        .project-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1.2rem 0;
            cursor: pointer;
            user-select: none;
        }

        /* 중심 글자: Plus Jakarta Sans / 10pt 설정 */
        .project-item {
            font-family: var(--font-main);
            font-size: 10pt;
            font-weight: 400;
            letter-spacing: 0.08em;
            color: rgba(255, 255, 255, 0.4);
            text-align: center;
            white-space: nowrap;
            transition: color var(--transition-speed), transform var(--transition-speed), opacity var(--transition-speed);
            text-shadow: 0 1px 4px rgba(0,0,0,0.4);
        }

        .project-wrapper.active .project-item {
            color: #FFFFFF;
            font-weight: 600;
            transform: scale(1.05);
        }

        /* 프로젝트 하단 건축 형태 정보: 흰 글씨 / 8pt 설정 */
        .project-type {
            font-family: var(--font-main);
            font-size: 8pt;
            font-weight: 300;
            letter-spacing: 0.1em;
            color: #FFFFFF;
            margin-top: 0.4rem;
            opacity: 0;
            height: 0;
            overflow: hidden;
            transition: opacity var(--transition-speed), height var(--transition-speed), margin-top var(--transition-speed);
            text-transform: uppercase;
            text-shadow: 0 1px 3px rgba(0,0,0,0.5);
        }

        .project-wrapper.active .project-type {
            opacity: 0.9;
            height: auto;
        }

        /* Scroll Helper Indicator */
        .scroll-indicator {
            position: fixed;
            bottom: 3rem;
            right: 5%;
            z-index: 10;
            font-size: 7.5pt;
            letter-spacing: 0.12em;
            color: #FFFFFF;
            opacity: 0.5;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <!-- Background Images (배경 이미지 링크) -->
    <div class="bg-container">
        <div class="bg-image active" style="background-image: url('https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=1920&q=80');"></div>
        <div class="bg-image" style="background-image: url('https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?auto=format&fit=crop&w=1920&q=80');"></div>
        <div class="bg-image" style="background-image: url('https://images.unsplash.com/photo-1600607687939-ce8a6c25118c?auto=format&fit=crop&w=1920&q=80');"></div>
        <div class="bg-image" style="background-image: url('https://images.unsplash.com/photo-1513694203232-719a280e022f?auto=format&fit=crop&w=1920&q=80');"></div>
    </div>

    <div class="overlay"></div>

    <header>
        <a href="#" class="logo">STUDIO VARA</a>
        <nav>
            <a href="#">Work</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <main class="project-slider">
        <div class="project-list" id="projectList">
            
            <!-- 프로젝트 1 -->
            <div class="project-wrapper active" data-index="0">
                <div class="project-item">01. BIODEGRADABLE VAULT</div>
                <div class="project-type">Pavilion / Structure</div>
            </div>

            <!-- 프로젝트 2 -->
            <div class="project-wrapper" data-index="1">
                <div class="project-item">02. METROPOLITAN TOWER</div>
                <div class="project-type">Office / Commercial</div>
            </div>

            <!-- 프로젝트 3 -->
            <div class="project-wrapper" data-index="2">
                <div class="project-item">03. ALL CITY CAMPUS</div>
                <div class="project-type">Educational / Masterplan</div>
            </div>

            <!-- 프로젝트 4 -->
            <div class="project-wrapper" data-index="3">
                <div class="project-item">04. LIGHT & CONCRETE GALLERY</div>
                <div class="project-type">Cultural / Exhibition</div>
            </div>

        </div>
    </main>

    <div class="scroll-indicator">
        Scroll to Explore
    </div>

    <script>
        const projectList = document.getElementById('projectList');
        const wrappers = document.querySelectorAll('.project-wrapper');
        const bgImages = document.querySelectorAll('.bg-image');

        let currentIndex = 0;
        let isCoolingDown = false;
        const totalItems = wrappers.length;

        function updateSlider(index) {
            if (index < 0 || index >= totalItems) return;

            currentIndex = index;

            // 1. 선택된 항목을 화면 중앙으로 이동
            const wrapperHeight = wrappers[0].clientHeight;
            const offset = -(currentIndex * wrapperHeight) + (wrapperHeight / 2) - 20;
            projectList.style.transform = `translateY(${offset}px)`;

            // 2. 클래스 변경 (활성화 항목 처리)
            wrappers.forEach((wrapper, i) => {
                if (i === currentIndex) {
                    wrapper.classList.add('active');
                } else {
                    wrapper.classList.remove('active');
                }
            });

            // 3. 배경 이미지 전환 (선명도 높아진 배경)
            bgImages.forEach((bg, i) => {
                if (i === currentIndex) {
                    bg.classList.add('active');
                } else {
                    bg.classList.remove('active');
                }
            });
        }

        // 마우스 휠 스크롤 제어
        window.addEventListener('wheel', (e) => {
            if (isCoolingDown) return;

            if (e.deltaY > 0) {
                if (currentIndex < totalItems - 1) {
                    updateSlider(currentIndex + 1);
                    triggerCooldown();
                }
            } else {
                if (currentIndex > 0) {
                    updateSlider(currentIndex - 1);
                    triggerCooldown();
                }
            }
        });

        function triggerCooldown() {
            isCoolingDown = true;
            setTimeout(() => {
                isCoolingDown = false;
            }, 600);
        }

        // 클릭 시 스크롤 이동
        wrappers.forEach((wrapper, i) => {
            wrapper.addEventListener('click', () => {
                updateSlider(i);
            });
        });

        // 초기 실행
        window.addEventListener('load', () => {
            updateSlider(0);
        });
    </script>
</body>
</html>
